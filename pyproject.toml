[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smsmonster"
version = "0.1.0"
description = "Self-hosted SMS gateway for SIM800C USB modems (Raspberry Pi / Home Assistant add-on)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "pyserial>=3.5",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
smsmonster = "smsmonster.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smsmonster = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
